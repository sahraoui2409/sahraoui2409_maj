Desc=  يل الأول زائد المبلغ المراد تحويله إلى باب أخر التحديث يخص جانب التحولات ، تستطيع الآن التحويل من مادة إلى مادة ومن نفس المادة إلى باب أخر(كمثال تحويل من الباب02 المادة01 إلى المادة 02 و تستطيع التحوبل من الباب02 المادة 01 إلى باب أخر) ملاحظة هامة : إذا قمت بتحويل من المادة إلى مادة أخرى و أردت التحويل من هذه المادة إلى باب أخر يجب أن يكون المبلغ المحول هو مجموع التحو


























